spring.application.name=JWT_springboot3_Nimbus
server.port=8005

# Default de project co the chay ngay tren IntelliJ, khong can cai MySQL.
spring.datasource.url=jdbc:h2:mem:jwtdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=123
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT: giu co che HS256 cua bai giang, nhung dung Nimbus JOSE + JWT thay JJWT.
# HS256 yeu cau khoa bi mat du dai (>= 32 bytes).
security.jwt.secret-key=3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b
# 1 hour in milliseconds
security.jwt.expiration-time=3600000
